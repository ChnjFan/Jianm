name: Smoke Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  broker-unit:
    name: C++ Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasio-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DJIANM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run C++ tests
        run: |
          cd build && ctest --output-on-failure

  broker-integration:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    needs: broker-unit
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libasio-dev

      - name: Build broker
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DJIANM_BUILD_TESTS=OFF
          cmake --build build -j$(nproc)

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r test/integration/requirements.txt

      - name: Run integration tests
        env:
          JIANM_BIN: ${{ github.workspace }}/build/bin/jianm
        run: |
          cd test/integration && python -m pytest --tb=short -v

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: broker-logs-${{ matrix.python-version }}
          path: build/bin/*.log
          if-no-files-found: ignore
