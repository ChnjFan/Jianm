# =============================================================================
# Jianm Server Configuration
# =============================================================================
# Format: key = value
# Lines starting with # or ; are treated as comments; blank lines are ignored.
# Any key not present here falls back to its built-in default.
# =============================================================================

# -----------------------------------------------------------------------------
# Log level
# -----------------------------------------------------------------------------
# One of: trace, debug, info, warn, error, critical
# Default: debug
# -----------------------------------------------------------------------------
log_level = trace

# -----------------------------------------------------------------------------
# Log output target
# -----------------------------------------------------------------------------
# Where to write log messages.
#   - "console" (default): print to stdout with color
#   - a file path (e.g. "/var/log/jianm.log"): write to file (no color codes)
# -----------------------------------------------------------------------------
; log_output = console

# -----------------------------------------------------------------------------
# MQTT server port
# -----------------------------------------------------------------------------
# TCP port that MQTT clients connect to.
# Default: 1883 (standard MQTT port)
# -----------------------------------------------------------------------------
port = 1883

# -----------------------------------------------------------------------------
# Admin console port
# -----------------------------------------------------------------------------
# TCP port for the telnet-based admin console. Connect with:
#   telnet localhost 10000
# Default: 10000
# -----------------------------------------------------------------------------
admin_port = 10000

# -----------------------------------------------------------------------------
# Maximum receive buffer size (bytes)
# -----------------------------------------------------------------------------
# Per-connection buffer used for incoming data.
# Default: 1024
# -----------------------------------------------------------------------------
max_receive_size = 1024

# -----------------------------------------------------------------------------
# Allow anonymous connections
# -----------------------------------------------------------------------------
# Controls whether clients may connect without providing a username/password.
#
# Authentication is REQUIRED when:
#   - this key is empty (commented out / not set), or
#   - this key is set to "false"
#
# Authentication is SKIPPED (anonymous allowed) when:
#   - this key is set to any non-empty value other than "false"
#     (e.g. "true", "1", "yes")
#
# Default: empty (authentication required)
# -----------------------------------------------------------------------------
allow_anonymous = true

